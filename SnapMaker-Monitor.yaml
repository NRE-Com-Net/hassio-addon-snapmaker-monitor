---
# Snapmaker Monitor: example Home Assistant configuration
#
# Put this file into your packages folder, for example
# /config/packages/snapmaker.yaml, and enable packages in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Use the webhook OR the MQTT part, depending on how the add-on sends the
# status. The automation at the end is optional.

# ------------------------------------------------------------------------------
# Webhook: set the add-on option ha_webhook_id to "wh-snapmaker"
# ------------------------------------------------------------------------------
template:
  - triggers:
      - trigger: webhook
        webhook_id: wh-snapmaker
        allowed_methods:
          - POST
          - PUT
        local_only: true
    sensor:
      - name: "SnapMaker 2.0"
        icon: mdi:printer-3d
        unique_id: "sensor.snapmaker_state"
        state: "{{ trigger.json.get('status', 'UNAVAILABLE') }}"
        attributes:
          ip: "{{ trigger.json.get('ip') }}"
          x: "{{ trigger.json.get('x') }}"
          y: "{{ trigger.json.get('y') }}"
          z: "{{ trigger.json.get('z') }}"
          homed: "{{ trigger.json.get('homed') }}"
          offsetX: "{{ trigger.json.get('offsetX') }}"
          offsetY: "{{ trigger.json.get('offsetY') }}"
          offsetZ: "{{ trigger.json.get('offsetZ') }}"
          toolHead: "{{ trigger.json.get('toolHead') }}"
          nozzleTemperature: "{{ trigger.json.get('nozzleTemperature') }}"
          nozzleTargetTemperature: "{{ trigger.json.get('nozzleTargetTemperature') }}"
          nozzleTemperature2: "{{ trigger.json.get('nozzleTemperature2') }}"
          nozzleTargetTemperature2: "{{ trigger.json.get('nozzleTargetTemperature2') }}"
          heatedBedTemperature: "{{ trigger.json.get('heatedBedTemperature') }}"
          heatedBedTargetTemperature: "{{ trigger.json.get('heatedBedTargetTemperature') }}"
          isFilamentOut: "{{ trigger.json.get('isFilamentOut') }}"
          spindleSpeed: "{{ trigger.json.get('spindleSpeed') }}"
          laserFocalLength: "{{ trigger.json.get('laserFocalLength') }}"
          laserPower: "{{ trigger.json.get('laserPower') }}"
          laserCamera: "{{ trigger.json.get('laserCamera') }}"
          laser10WErrorState: "{{ trigger.json.get('laser10WErrorState') }}"
          workSpeed: "{{ trigger.json.get('workSpeed') }}"
          printStatus: "{{ trigger.json.get('printStatus') }}"
          fileName: "{{ trigger.json.get('fileName') }}"
          totalLines: "{{ trigger.json.get('totalLines') }}"
          currentLine: "{{ trigger.json.get('currentLine') }}"
          progress: "{{ trigger.json.get('progress') }}"
          estimatedTime: "{{ trigger.json.get('estimatedTime') }}"
          elapsedTime: "{{ trigger.json.get('elapsedTime') }}"
          remainingTime: "{{ trigger.json.get('remainingTime') }}"
          enclosure: "{{ (trigger.json.get('moduleList') or {}).get('enclosure') }}"
          rotaryModule: "{{ (trigger.json.get('moduleList') or {}).get('rotaryModule') }}"
          emergencyStopButton: "{{ (trigger.json.get('moduleList') or {}).get('emergencyStopButton') }}"
          airPurifier: "{{ (trigger.json.get('moduleList') or {}).get('airPurifier') }}"
          isEnclosureDoorOpen: "{{ trigger.json.get('isEnclosureDoorOpen') }}"
          doorSwitchCount: "{{ trigger.json.get('doorSwitchCount') }}"

# ------------------------------------------------------------------------------
# MQTT: the add-on publishes a retained JSON message to "snapmaker/status"
# ------------------------------------------------------------------------------
mqtt:
  sensor:
    - name: "SnapMaker 2.0"
      icon: mdi:printer-3d
      unique_id: "snapmaker_state_mqtt"
      state_topic: "snapmaker/status"
      value_template: "{{ value_json.status }}"
      json_attributes_topic: "snapmaker/status"

# ------------------------------------------------------------------------------
# Optional: start and stop the add-on together with the printer's smart plug.
# Replace switch.snapmaker_plug with the entity of your plug.
# ------------------------------------------------------------------------------
automation:
  - alias: Snapmaker Monitor
    description: "Start and stop the add-on with the Snapmaker smart plug"
    triggers:
      - trigger: state
        entity_id: switch.snapmaker_plug
        to:
          - "on"
          - "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.snapmaker_plug
                state: "on"
            sequence:
              - action: hassio.addon_start
                data:
                  addon: 71611ba3_snapmaker-monitor
        default:
          - action: hassio.addon_stop
            data:
              addon: 71611ba3_snapmaker-monitor
    mode: restart
