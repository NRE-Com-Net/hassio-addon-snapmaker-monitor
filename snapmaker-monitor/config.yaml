---
name: Snapmaker Monitor
version: dev
slug: snapmaker-monitor
description: Monitor the status of a Snapmaker 2.0 and send it to Home Assistant via webhook or MQTT.
url: https://github.com/NRE-Com-Net/hassio-addon-snapmaker-monitor
boot: manual_only
init: false
homeassistant_api: true
services:
  - mqtt:want
arch:
  - aarch64
  - amd64
options:
  log_level: info
  sm_ip: null
  sm_port: 8080
  ha_webhook_id: ""
  mqtt_broker: ""
  mqtt_port: 1883
  mqtt_topic: snapmaker/status
  mqtt_user: ""
  mqtt_password: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  sm_ip: str
  sm_port: port
  ha_webhook_id: str?
  mqtt_broker: str?
  mqtt_port: port?
  mqtt_topic: str?
  mqtt_user: str?
  mqtt_password: password?
